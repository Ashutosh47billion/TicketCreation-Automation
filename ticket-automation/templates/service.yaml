apiVersion: v1
kind: Service
metadata:
  name: {{ include "ticket-automation.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ticket-automation.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "ticket-automation.selectorLabels" . | nindent 4 }}
